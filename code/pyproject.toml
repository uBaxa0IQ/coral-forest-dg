[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coral-forest-dg"
version = "0.1.0"
description = "Reproducible source-only domain generalization experiments for tree ensembles"
requires-python = ">=3.12"
dependencies = [
  "numpy<2", "scipy", "pandas<3", "scikit-learn==1.3.2", "pyarrow<20", "PyYAML",
  "matplotlib<3.11", "requests", "cvxpy==1.7.5", "osqp==1.0.4", "scs==3.2.8", "lightgbm==4.6.0", "xgboost<3", "folktables", "psutil",
]

[project.optional-dependencies]
research = ["pypdf", "pymupdf", "anchorboosting==0.4.0", "erasplit==1.0.7"]
test = ["pytest"]

[project.scripts]
nir-dg = "nir_dg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
